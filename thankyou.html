<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You</title>
  <style>
    body {
      margin: 0;
      background-color: #000;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      text-align: center;
    }

    h1 {
      color: #00bfff;
      font-size: 3rem;
      margin: 1rem 0 0.5rem;
    }

    p {
      font-size: 1.2rem;
      margin-bottom: 2rem;
      color: #ccc;
    }

    .timer {
      margin-top: 20px;
      font-size: 1rem;
      color: #aaa;
    }

    lottie-player {
      width: 300px;
      height: 300px;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 2rem;
      }

      p {
        font-size: 1rem;
      }

      .timer {
        font-size: 0.9rem;
      }

      lottie-player {
        width: 200px;
        height: 200px;
      }
    }
  </style>
  <!-- Redirect after 10 seconds -->
  <script>
    let counter = 10;
    const countdown = () => {
      document.getElementById("timer").textContent = `You will be redirected in ${counter} second${counter === 1 ? "" : "s"}...`;
      counter--;
      if (counter < 0) {
        window.location.href = "https://new-digitalized.vercel.app/"; // Change to your homepage URL
      }
    };
    setInterval(countdown, 1000);
  </script>
</head>
<body>
  <!-- Lottie animation -->
  <lottie-player 
    src="https://lottie.host/f4a17764-36c3-4687-bdf3-54426fd661f2/U3xStNplNi.json"  
    background="transparent"  
    speed="1"  
    loop  
    autoplay>
  </lottie-player>

  <h1>Thank You for Submitting!</h1>
  <p>We’ve received your message and will get back to you shortly.</p>
  <div class="timer" id="timer">You will be redirected in 10 seconds...</div>
</body>
</html>
